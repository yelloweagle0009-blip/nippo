<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f1868">
<link rel="icon" href="icon-192.png">
<title>運行連絡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@700&display=swap">
<style>
/* 運行連絡：GPS で「着いた・出た」を決めて、LINE の文と日報の行を作る。送るのは必ず本人 */
:root{
  --paper:#f5f2fa; --sheet:#ffffff; --ink:#221a33; --muted:#6c6480; --rule:#ddd4ea;
  --accent:#5a2a91; --accent-ink:#ffffff; --accent-soft:#efe6f9; --warn:#9c4d0a; --warn-soft:#fbeee2; --ok:#1f6b3a; --ok-soft:#e3f3e8;
  --hero1:#3f1868; --hero2:#7440b5; --glow:rgba(90,42,145,.14);
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:"BIZ UDGothic","BIZ UDPGothic",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15111d; --sheet:#1f1a2a; --ink:#ece6f6; --muted:#a79fba; --rule:#3a3150;
  --accent:#c3a2f0; --accent-ink:#1d1030; --accent-soft:#2c2240; --warn:#e8a46a; --warn-soft:#3a2816; --ok:#7fd49b; --ok-soft:#1c3324; --hero1:#2a1146; --hero2:#4f2a80; --glow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15111d; --sheet:#1f1a2a; --ink:#ece6f6; --muted:#a79fba; --rule:#3a3150;
  --accent:#c3a2f0; --accent-ink:#1d1030; --accent-soft:#2c2240; --warn:#e8a46a; --warn-soft:#3a2816; --ok:#7fd49b; --ok-soft:#1c3324; --hero1:#2a1146; --hero2:#4f2a80; --glow:rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.pad{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;padding-top:env(safe-area-inset-top,0px)}
header .pad{padding-block:10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header a{color:#fff;font-size:14px}
.rec{font-size:13px;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;white-space:nowrap}
.rec.on::before{content:"●";color:#7dff9e;margin-right:4px}
main .pad{padding-block:12px 120px}
h2{font-size:14px;color:var(--accent);letter-spacing:.12em;margin:18px 0 8px}
.card{background:var(--sheet);border:1.5px solid var(--rule);border-radius:12px;padding:12px;margin:0 0 10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card.now{border-color:var(--accent)}
.card h3{margin:0 0 6px;font-size:18px}
.sub{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:14px;margin:0 0 10px}
.okb{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 10px;font-size:14px;margin:0 0 10px}
.btn{font:inherit;font-size:16px;font-weight:700;border:1.5px solid var(--accent);background:var(--sheet);color:var(--accent);border-radius:12px;padding:12px 14px;min-height:48px;width:100%;text-align:center;cursor:pointer}
.btn.solid{background:linear-gradient(135deg,var(--hero1),var(--hero2));border-color:transparent;color:#fff;box-shadow:0 3px 10px var(--glow)}
.btn.sm{font-size:14px;padding:6px 10px;min-height:38px;width:auto;border-radius:999px}
.btn.line{background:#06c755;border-color:#06c755;color:#fff}
.btn.ghost{border-color:var(--rule);color:var(--muted)}
.btn:disabled{opacity:.45}
.stack{display:grid;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font:inherit;font-size:15px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:8px 12px;min-height:40px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:5.6em 1fr auto;gap:4px 8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--rule);cursor:pointer}
.tl li:last-child{border-bottom:0}
.tl .t{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;line-height:1.25}
.tl .t small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted)}
.tl .n{font-weight:700;min-width:0;overflow-wrap:anywhere}
.tl .n small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.sts{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.st{font-size:12px;border-radius:999px;padding:2px 8px;white-space:nowrap}
.st.sent{background:var(--ok-soft);color:var(--ok)}
.st.wait{background:var(--warn-soft);color:var(--warn)}
.st.none{color:var(--muted)}
.msg{border:1px solid var(--rule);border-radius:10px;padding:10px;margin:0 0 8px;background:var(--sheet)}
.msg p{margin:0 0 8px;font-size:16px;overflow-wrap:anywhere}
textarea,input,select{font:inherit;font-size:17px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:8px}
.bar .btn{font-size:14px;padding:8px 4px;min-height:44px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.kp button{font:inherit;font-family:var(--f-num);font-size:24px;min-height:54px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px}
.disp{font-family:var(--f-num);font-size:30px;text-align:center;background:var(--accent-soft);border-radius:10px;padding:6px;min-height:52px}
.cg{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;margin:4px 0}
.toast{position:fixed;left:12px;right:12px;bottom:84px;z-index:9;background:var(--ink);color:var(--paper);border-radius:12px;padding:12px;font-size:15px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast .btn{margin-top:8px}
a.map{color:var(--accent)}
</style>
</head>
<body>
<header><div class="pad"><h1 id="hd">運行連絡</h1><span id="rec" class="rec">止まっています</span><a href="./">日報へ</a></div></header>
<main><div class="pad" id="view"></div></main>
<nav class="bar" id="bar" hidden><div class="pad">
  <button class="btn" data-go="compose">自分で書く</button>
  <button class="btn" data-go="plan">予定を入れる</button>
  <button class="btn" data-act="wash">洗車・給油</button>
  <button class="btn" data-go="nippo">日報に入れる</button>
  <button class="btn" data-go="places">場所の登録</button>
  <button class="btn" data-act="end">終わり</button>
</div></nav>
<div id="toast" class="toast" hidden></div>
<script>
'use strict';
const A=window.NippoAndroid;
const HAS=!!(A&&A.tripAvailable&&A.tripAvailable());
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const hmOf=ts=>{ const d=new Date(ts); return d.getHours()+':'+pad2(d.getMinutes()); };
const hmsOf=ts=>{ const d=new Date(ts); return d.getHours()+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); };
const WD='日月火水木金土';
let S=null, raw='', view='home', arg=null, lastSend=null;

// ---- 日報の時刻：5分刻み（いちばん近い5分。設定で「いつも切り捨て」）----
function round5(ts,mode){ const d=new Date(ts); let m=d.getHours()*60+d.getMinutes()+d.getSeconds()/60; m=mode==='floor'?Math.floor(m/5)*5:Math.round(m/5)*5; return m; }
const mHM=m=>{ m=((m%1440)+1440)%1440; return pad2(Math.floor(m/60))+':'+pad2(m%60); };
const mShow=m=>{ m=((m%1440)+1440)%1440; return Math.floor(m/60)+':'+pad2(m%60); };

// ---- 場所を登録したときの、最初の文（あとで直せる）。名取さんの実際の LINE から ----
function defaults(name){
  const n=name||'', o={type:'site',r:60,arrText:'',doneTexts:[n+'完了しました！']};
  if(/車庫/.test(n)) return {type:'garage',r:60,arrText:'',doneTexts:[]};
  if(/洗車|給油|スタンド/.test(n)) return {type:'stop',r:50,arrText:'',doneTexts:[]};
  if(/パナソニック|Panasonic/i.test(n)) o.doneTexts=['Panasonic{n}回目納品完了しました！'];
  else if(/勝山/.test(n)) o.doneTexts=['勝山完了しました！'];
  else if(/富士吉田/.test(n)) o.doneTexts=['富士吉田納品引き取り完了！{next}に向います！','富士吉田納品引き取り完了しました！','富士吉田納品完了！引き取り無しです！'];
  else if(/小石和/.test(n)) o.doneTexts=[];   // 小石和倉庫の横持ちの後は KFK に戻ってから「KFK完了！帰庫します！」
  else if(/マシンセンター|甲府南|KFK/.test(n)){
    // 朝（牧野に行く前）に出るとき：予定が入っていれば「富士吉田、納品引き取りになります！🚛」。無ければ送らない（Panasonic の日）
    o.beforeTexts=['{planMsg}'];
    // 牧野（勝山・富士吉田）の後に出るとき
    o.doneTexts=['KFK完了！帰庫します！','勝山引き取り分、納品完了しました！小石和倉庫の横持ちに向います！','KFK完了！洗車＆給油してから帰庫します！'];
  }
  if(/マシンセンター/.test(n)){ o.arrText='マシンセンター到着しました！'; o.r=50; }
  if(/甲府南/.test(n)){ o.arrText='甲府南工場着です！'; o.r=50; }
  return o;
}
const PHRASES=['洗車＆給油完了しました！','洗車完了しました！','給油完了しました！','マシンセンター付近着です！','勝山引き取り分、納品完了しました！小石和倉庫の横持ちに向います！','KFK完了！洗車＆給油してから帰庫します！'];
const NAMES=['車庫','KFKマシンセンター','KFK甲府南工場','国母パナソニック','牧野フライス勝山','牧野フライス富士吉田','小石和倉庫','洗車場','給油所'];
const WORDS=['到着しました！','完了しました！','向かいます！','待機中です','遅れます','渋滞です','納品','引き取り','帰庫します！'];
const SHORT=n=>({'KFKマシンセンター':'マシンセンター','KFK甲府南工場':'甲府南','国母パナソニック':'Panasonic','牧野フライス勝山':'勝山','牧野フライス富士吉田':'富士吉田','小石和倉庫':'小石和'}[n]||n);

// 今日の記録だけを使う（前の日の記録が残っていても、今日の画面・日報には出さない）
const T=()=>{ const t=(S&&S.trip)||{}; return t.day===today()?t:{}; };
const C=()=>(S&&S.conf)||{};
function confSave(c){ if(!HAS) return; A.confSave(JSON.stringify(c)); load(true); }
function patch(kind,id,o){ if(!HAS) return; A.tripPatch(kind,id,JSON.stringify(o)); load(true); }
function add(kind,o){ if(!HAS) return -1; const id=A.tripAdd(kind,JSON.stringify(o)); load(true); return id; }
// 今日の予定（行き先を順番に。例：富士吉田→勝山）
const plansToday=()=>{ const c=C(); if(c.planDay!==today()) return []; return Array.isArray(c.plans)?c.plans:(c.plan?[c.plan]:[]); };
const visitedToday=x=>(T().visits||[]).some(v=>v.arr!=null&&(v.name.includes(x)||(x==='Panasonic'&&/パナソニック/.test(v.name))));
const restPlans=()=>plansToday().filter(x=>!visitedToday(x));
// 名取さんの LINE（11/4・11/11・11/12・11/13）の書き方
const planMsg=P=>!P.length?'':P.length===1?`${P[0]}、納品引き取りになります！🚛`:`${P[0]}、${P.slice(1).join('、')}納品引き取りになります！🚛${P[0]}からまわります！`;
const planToday=()=>restPlans().join('、');
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
const places=()=>C().places||[];
const visits=()=>(T().visits||[]).slice().sort((a,b)=>(a.arr??a.dep??0)-(b.arr??b.dep??0));
const msgsOf=vid=>(T().msgs||[]).filter(m=>m.vid===vid);
const unsent=()=>(T().msgs||[]).filter(m=>m.posted&&!m.sent&&!m.skip);

// LINE を開く（送る先を選ぶ画面に文が入る）。送信は本人
function send(text,mid){
  if(!text) return;
  lastSend={mid,text,ts:Date.now()};
  if(HAS) A.lineSend(text,mid==null?-1:mid);
  else location.href='https://line.me/R/share?text='+encodeURIComponent(text);
}
window.onAppResume=()=>{ load(true);
  if(lastSend&&lastSend.mid!=null&&lastSend.mid>=0&&Date.now()-lastSend.ts<30*60000){ const m=lastSend; lastSend=null;
    toast(`LINE を開いたので「送信済み」にしました。<br><b>${esc(m.text)}</b><div class="two"><button class="btn sm" data-undo="${m.mid}">送っていない（未送信に戻す）</button><button class="btn sm" data-tclose>送った</button></div>`,15000); } };
let tT=null;
function toast(h,ms){ const el=$('toast'); el.innerHTML=h; el.hidden=false; clearTimeout(tT); tT=setTimeout(()=>el.hidden=true,ms||4000); }

// ---- 出庫 ----
window.onTripStarted=r=>{
  if(r==='denied'){ toast('位置の許可が無いので記録できません。もう一度［出庫］を押して、「正確な位置」をオンにしたまま「アプリの使用中のみ」を選んでください。出てこないときは、スマホの設定 → アプリ → 運行日報 → 権限 → 位置情報 で「アプリの使用中のみ許可」と「正確な位置情報を使用」をオンにしてください。',9000); return; }
  load(true);
  if(r===false){
    const c=C(); c.plan=''; c.planDay=''; A.confSave(JSON.stringify(c));
    const car=T().car, text=`おはようございます!${car}番出庫します!🚛`;
    const id=add('msgs',{kind:'depart',vid:-1,texts:[text],ts:Date.now(),sent:false,posted:true});
    send(text,id);
  } else toast('今日の記録の続きから始めました（昼に車庫へ戻ったときなど）。');
};

function load(force){
  if(!HAS) return;
  const s=A.tripState(); if(!s) return;
  const o=JSON.parse(s), tr=o.trip||{};
  // 5秒ごとに変わる値（いまの時刻・最後の位置・止まり判定の途中）は比べない
  const key=JSON.stringify([o.conf,o.running,o.loc,{...tr,lastFix:0,anchor:0,cand:0,cur:tr.cur?{...tr.cur,outSince:0}:0}]);
  if(!force&&key===raw) return;
  raw=key; S=o;
  if(view==='home'&&!document.activeElement.matches('input,textarea,select')) render();
  head();
}
function head(){
  const t=T(), d=new Date();
  $('hd').textContent=`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`+(t.active?` ${t.car}番`:'');
  const on=t.active&&S.running; $('rec').textContent=on?'記録中':(t.active?'記録が止まっています':'止まっています'); $('rec').classList.toggle('on',!!on);
  $('bar').hidden=!HAS||view!=='home';
}

// ---- 画面 ----
function go(v,a){ view=v; arg=a; render(); scrollTo(0,0); }
function render(){ head(); const f=V[view]||V.home; $('view').innerHTML=f(arg); }
const back=`<p><button class="btn ghost" data-go="home">← もどる</button></p>`;

function placeOf(id){ return places().find(p=>p.id===id); }
function timeCell(v){
  const mode=C().round||'near';
  if(v.arr==null&&v.dep==null) return '<span class="t">—</span>';
  const a=v.arr!=null?mShow(round5(v.arr,mode)):'', d=v.dep!=null?mShow(round5(v.dep,mode)):'';
  return `<span class="t">${a||'　'}${d?'-'+d:(v.arr!=null?'-':'')}<small>${v.arr!=null?hmOf(v.arr):''}${v.dep!=null?'〜'+hmOf(v.dep):''}</small></span>`;
}
function stOf(v){
  const ms=msgsOf(v.id).filter(m=>m.texts&&m.texts.length); if(!ms.length) return '<span class="st none">連絡なし</span>';
  return '<span class="sts">'+ms.map(m=>m.sent?'<span class="st sent">✓送信済み</span>':m.skip?'<span class="st none">送らない</span>':m.posted?'<span class="st wait">⏳未送信</span>':'<span class="st none">まだ</span>').join('')+'</span>';
}
const cargoTxt=v=>(v.cargo||[]).filter(x=>x.n).map(x=>(x.dir==='in'?'積':'卸')+x.n+(x.unit||'')).join('・');

const V={
home(){
  if(!HAS) return `<div class="card"><h3>Android のアプリで使えます</h3><p class="note">運行連絡は、位置を見て「着いた・出た」を決めるので、運行日報の Android アプリの中だけで動きます。</p></div>`;
  const t=T(), c=C(); let h='';
  if(!places().length) h+=`<div class="warn">まだ場所が登録されていません。いつもの場所（車庫・荷主）に着いたときに、下の［場所の登録］で1か所ずつ登録してください。</div>`;
  if(!S.loc) h+=`<div class="warn">位置の許可がありません。［出庫］を押すと聞かれるので、「アプリの使用中のみ」を選んでください。</div>`;
  if(t.active&&!S.running) h+=`<div class="warn">記録が止まっています（スマホが止めた可能性）。この画面を開いたので、続きを始めます。止まっていた間は「位置が分からない時間」になります。</div>`;
  if(!t.active){
    const cars=c.cars||[6,8], sel=c.car||cars[0];
    h+=`<div class="card"><h3>出庫</h3><p class="sub">車番を選んで［出庫］。LINE に「おはようございます!${sel}番出庫します!🚛」が入った状態で開きます（送るのは自分）。休みの日は押さなければ、位置は一度も見ません。</p>
      <div class="chips">${cars.map(n=>`<button class="chip${n==sel?' on':''}" data-car="${n}">${n}番</button>`).join('')}<button class="chip" data-act="carAdd">＋車番</button></div>
      <button class="btn solid" data-act="start">出庫（記録を始める）</button></div>`;
    if(t.day===today()&&t.startTs) h+=`<div class="okb">今日の記録は ${t.endWhy==='garage'?'車庫に着いたので':''}止まっています。続ける時は［出庫］を押すと、続きから記録します（LINE の出庫連絡は出しません）。</div>`;
  }
  // いまの場所カード
  const cur=t.cur;
  if(t.active&&cur){
    const p=placeOf(cur.pid)||{name:'?'}, v=(t.visits||[]).find(x=>x.id===cur.vid);
    if(!cur.arrived) h+=`<div class="card now"><h3>${esc(p.name)}</h3><p class="sub">円に入りました（${hmOf(cur.enter)}）。${Math.round(C().params?.dwellSec??120)/60|0}分そこにいると「着いた」にします。通り過ぎるだけなら何も残りません。</p></div>`;
    else if(v) h+=placeCard(v,p,true);
  }
  // 未送信
  const un=unsent().filter(m=>!(cur&&cur.arrived&&m.vid===cur.vid));
  if(un.length){ h+=`<h2>未送信の連絡（${un.length}）</h2>`; un.forEach(m=>h+=msgBox(m)); }
  // 止まった所（未登録）
  const sts=(t.stops||[]).filter(s=>s.status==='new'&&s.end);

// ---- 日報の行を作る（車庫・荷主だけ。立ち寄りは行にしない）----
function buildRows(){
  const t=T(), mode=C().round||'near';
  const vs=visits().filter(v=>v.type!=='stop');
  // 車庫を登録していない・車庫の外で出庫を押した：出庫ボタンの時刻を「車庫 発」にする
  if(t.startTs&&(!vs.length||vs[0].type!=='garage')) vs.unshift({name:'車庫',type:'garage',dep:t.startTs,cargo:[],meter:''});
  const rows=[]; let board={};
  vs.forEach((v,i)=>{
    let a=v.arr!=null?round5(v.arr,mode):null, d=v.dep!=null?round5(v.dep,mode):null;
    if(a!=null&&d!=null&&d<=a) d=a+5;   // そろえて着と発が同じになったら、発を5分後に
    const cg=v.cargo||[], ins=cg.filter(x=>x.dir==='in'&&+x.n>0), outs=cg.filter(x=>x.dir==='out'&&+x.n>0);
    rows.push({arr:a!=null?mHM(a):'',dep:d!=null?mHM(d):'',meter:v.meter||'',place:v.name,
      cargo:{in:ins.length>0,out:outs.length>0,outOnly:outs.length>0&&!ins.length},cargoN:{in:ins.map(x=>x.n+x.unit).join('＋'),out:outs.map(x=>x.n+x.unit).join('＋')},
      auto:{arr:a!=null?1:0,dep:d!=null?1:0,place:1},gps:{arr:v.arr??null,dep:v.dep??null}});
  });
  // 実車・空車：積んだ数と降ろした数を数える（単位ごと）。数が合わないときは「次で降ろすなら実車」
  rows.forEach((r,i)=>{ const v=vs[i];
    (v.cargo||[]).filter(x=>x.dir==='out'&&+x.n>0).forEach(x=>{ if(!(board[x.unit]>0)) board={}; else board[x.unit]=Math.max(0,board[x.unit]-(+x.n||0)); });   // 積んだときと単位が違う（3台を積んで26PLで降ろした など）ときは、全部降ろしたとみなす
    (v.cargo||[]).filter(x=>x.dir==='in').forEach(x=>{ board[x.unit]=(board[x.unit]||0)+(+x.n||0); });
    const nx=rows[i+1]; r.loaded=i<rows.length-1&&(Object.values(board).some(n=>n>0)||!!(nx&&nx.cargo.out)); });
  const rests=(t.stops||[]).filter(s=>s.status==='rest'&&s.end).map(s=>({from:mHM(round5(s.start,mode)),to:mHM(round5(s.end,mode))}));
  return {rows,rests};
}
function toNippo(){
  const R=buildRows(), KEY='unkou-jissha-v2';
  let D=null; try{ D=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  const sameDay=D&&D.day&&new Date(D.day).toDateString()===new Date().toDateString();
  if(!D||!sameDay) D={day:Date.now(),start:'',end:'',rows:[],rests:[{from:'',to:''}],waits:[{from:'',to:''}]};
  const had=(D.rows||[]).some(r=>r.arr||r.dep||r.meter||r.place);
  if(had&&!confirm('日報の画面に今日の行がもう入っています。この内容で入れ替えますか？（始業時メーター・待機は残します）')) return;
  D.rows=R.rows.map(r=>({arr:r.arr,dep:r.dep,meter:r.meter,loaded:r.loaded,cargo:r.cargo,cargoN:r.cargoN,place:r.place,auto:r.auto,gps:r.gps}));
  if(R.rests.length) D.rests=R.rests; else if(!Array.isArray(D.rests)||!D.rests.length) D.rests=[{from:'',to:''}];
  if(!Array.isArray(D.waits)) D.waits=[{from:'',to:''}];
  try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){ toast('保存できませんでした'); return; }
  toast('日報に入れました。日報の画面で確かめてください。');
  setTimeout(()=>location.href='./',900);
}

  if(m.kind==='garage') h+=`<label>点呼の時刻</label><input id="tk" type="time" value="${esc((C().tenko||'6:00').padStart(5,'0'))}" data-tk="${m.id}">`;
  m.texts.forEach((x,i)=>h+=`<p><b>${esc(x)}</b></p><button class="btn line" data-send="${m.id}" data-i="${i}" style="margin-bottom:6px">LINE で送る</button>`);
  return h+`<div class="two"><button class="btn sm" data-go="compose" data-a='${JSON.stringify({mid:m.id})}'>文を変える</button><button class="btn sm ghost" data-mark="${m.id}">送った</button></div><p style="margin:6px 0 0"><button class="btn sm ghost" data-skip="${m.id}">送らない</button></p></div>`;
}

// ---- 荷物・メーターの数字ボタン ----
const KP={i:0};
function cargoEdit(vid,fn){ const v=(T().visits||[]).find(x=>x.id===vid); if(!v) return; const cg=(v.cargo&&v.cargo.length?v.cargo:[{dir:'out',n:'',unit:'台'}]).map(x=>({...x})); const o={cargo:cg,meter:v.meter||''}; fn(o); patch('visits',vid,o); render(); }

document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-visit],[data-msg]'); if(!b) return; const d=b.dataset;
  if(d.tclose!=null){ $('toast').hidden=true; return; }
  if(d.undo!=null){ A.msgMark(+d.undo,false); $('toast').hidden=true; load(true); render(); return; }
  if(d.go){ let a=d.a; if(a!=null){ try{ a=JSON.parse(a); }catch(_){ } } if(d.go==='cargo') KP.i=0; go(d.go,a); return; }
  if(d.visit!=null){ go('visit',+d.visit); return; }
  if(d.msg!=null){ const m=(T().msgs||[]).find(x=>x.id===+d.msg); if(m&&!m.sent) send(m.texts[0],m.id); else if(m&&confirm('「未送信」に戻しますか？')){ A.msgMark(m.id,false); load(true); render(); } return; }
  if(d.car!=null){ const c=C(); c.car=+d.car; confSave(c); render(); return; }
  if(d.send!=null){ const m=(T().msgs||[]).find(x=>x.id===+d.send); if(m) send(m.texts[+d.i||0],m.id); return; }
  if(d.mark!=null){ A.msgMark(+d.mark,true); load(true); render(); return; }
  if(d.unmark!=null){ A.msgMark(+d.unmark,false); load(true); render(); return; }
  if(d.skip!=null){ patch('msgs',+d.skip,{skip:true}); render(); return; }
  if(d.ins!=null){ const tx=$('tx'); tx.value+=d.ins; return; }
  if(d.put!=null){ $('tx').value=(C().phrases||PHRASES.slice())[+d.put]; return; }
  if(d.plan!=null){ const c=C(); let P=plansToday().slice(); if(!d.plan) P=[]; else if(P.includes(d.plan)) P=P.filter(x=>x!==d.plan); else P.push(d.plan);
    c.plans=P; c.plan=''; c.planDay=P.length?today():''; confSave(c); if(HAS&&A.doneRefresh){ A.doneRefresh(); load(true); } render(); return; }
  if(d.wash!=null){ const text=d.wash; const id=T().active?add('msgs',{kind:'wash',vid:-1,texts:[text],ts:Date.now(),sent:false,posted:true}):-1; send(text,id); go('home'); return; }
  if(d.day!=null){ const mid=+d.mid; patch('msgs',mid,{texts:[garageText(d.day)],day:d.day}); render(); return; }
  if(d.round){ const c=C(); c.round=d.round; confSave(c); render(); return; }
  if(d.stop!=null){ stopAct(+d.stop,d.how); return; }
  if(d.ph!=null){ const c=C(); const ph=(c.phrases||PHRASES.slice()).slice(), i=+d.ph; if(d.how==='del') ph.splice(i,1); else if(i>0) [ph[i-1],ph[i]]=[ph[i],ph[i-1]]; c.phrases=ph; confSave(c); render(); return; }
  if(d.cdir!=null){ const vid=arg; cargoEdit(vid,o=>o.cargo[+d.cdir].dir=d.v); return; }
  if(d.cunit!=null){ const vid=arg; cargoEdit(vid,o=>o.cargo[+d.cunit].unit=d.v); return; }
  if(d.kpt!=null){ KP.i=d.kpt==='m'?'m':+d.kpt; render(); return; }
  if(d.kp!=null){ const vid=arg; cargoEdit(vid,o=>{ const cur=KP.i==='m'?o.meter:String(o.cargo[KP.i]?.n||''); let s=d.kp==='c'?'':d.kp==='b'?cur.slice(0,-1):(cur+d.kp).slice(0,KP.i==='m'?3:3);
    if(KP.i==='m') o.meter=s; else if(o.cargo[KP.i]) o.cargo[KP.i].n=s; }); return; }
  const act=d.act; if(!act) return;
  if(act==='start'){ const c=C(); A.tripStart(+(c.car||(c.cars||[6,8])[0])); return; }
  if(act==='carAdd'){ const n=prompt('車番（数字）'); if(n&&/^\d+$/.test(n)){ const c=C(); c.cars=[...new Set([...(c.cars||[6,8]),+n])].sort((a,b)=>a-b); c.car=+n; confSave(c); render(); } return; }
  if(act==='end'){ const un=unsent(); if(!confirm((un.length?`未送信の連絡が${un.length}件あります。\n`:'')+'今日の記録を止めますか？（あとで［出庫］を押すと続きから記録できます）')) return; A.tripStop(); setTimeout(()=>{ load(true); render(); },500); return; }
  if(act==='wash'){ go('wash'); return; }
  if(act==='washOld'){ const text='洗車＆給油完了しました！'; const id=T().active?add('msgs',{kind:'wash',vid:-1,texts:[text],ts:Date.now(),sent:false,posted:true}):-1; send(text,id); return; }
  if(act==='planSend'){ const R=restPlans(); const text=d.v==='am'?planMsg(R):`午後は${R.join('、')}、納品引き取りになります！`; const id=T().active?add('msgs',{kind:'plan',vid:-1,texts:[text],ts:Date.now(),sent:false,posted:true}):-1; send(text,id); return; }
  if(act==='txClear'){ $('tx').value=''; return; }
  if(act==='txBs'){ const tx=$('tx'); const all=NAMES.map(SHORT).concat(WORDS,places().map(p=>p.name)).sort((a,b)=>b.length-a.length); const w=all.find(x=>tx.value.endsWith(x)); tx.value=w?tx.value.slice(0,-w.length):tx.value.slice(0,-1); return; }
  if(act==='phAdd'){ const v=$('tx').value.trim(); if(!v) return; const c=C(); const ph=c.phrases||PHRASES.slice(); if(!ph.includes(v)) ph.push(v); c.phrases=ph; confSave(c); toast('「よく使う文」に登録しました'); render(); return; }
  if(act==='txSend'){ const v=$('tx').value.trim(); if(!v) return; let mid=d.mid?+d.mid:null;
    if(mid!=null){ const m=(T().msgs||[]).find(x=>x.id===mid); patch('msgs',mid,{texts:[v].concat((m?m.texts:[]).filter(x=>x!==v)),edited:true}); }
    else if(T().active) mid=add('msgs',{kind:'manual',vid:-1,texts:[v],ts:Date.now(),sent:false,posted:true});
    send(v,mid); go('home'); return; }
  if(act==='addVisit'){ const n=prompt('場所の名前（例：牧野フライス勝山）'); if(!n) return; const now=Date.now(); const p=places().find(x=>x.name===n);
    const id=add('visits',{name:n,pid:p?p.id:'',type:p?p.type:'site',arr:now,cargo:[],meter:'',manual:true}); go('visit',id); return; }
  if(act==='vSave'){ const vid=+d.v, v=(T().visits||[]).find(x=>x.id===vid); if(!v) return;
    const tsOf=(s,base)=>{ if(!s) return null; const [h,m]=s.split(':').map(Number); const x=new Date(base??T().startTs??Date.now()); x.setHours(h,m,0,0); return x.getTime(); };
    const o={name:$('vName').value.trim()||v.name,arr:tsOf($('vArr').value,v.arr),dep:tsOf($('vDep').value,v.dep??v.arr),fixed:true};
    if(o.arr==null) o.arr=null; if(o.dep==null) o.dep=null; patch('visits',vid,o); go('home'); return; }
  if(act==='vDel'){ if(confirm('この行を消しますか？')){ patch('visits',+d.v,{del:true}); go('home'); } return; }
  if(act==='cAdd'){ cargoEdit(arg,o=>o.cargo.push({dir:'in',n:'',unit:'PL'})); KP.i=((T().visits||[]).find(x=>x.id===arg)?.cargo||[]).length-1; render(); return; }
  if(act==='cDel'){ cargoEdit(arg,o=>{ if(o.cargo.length>1) o.cargo.pop(); else o.cargo=[{dir:'out',n:'',unit:'台'}]; }); KP.i=0; render(); return; }
  if(act==='pHere'){ const n=$('pName').value.trim(); if(!n){ $('pMsg').textContent='先に名前を入れてください'; return; } getFix(f=>{ const id='p'+Date.now(); const c=C(); c.places=(c.places||[]).concat([{id,name:n,lat:f.lat,lon:f.lon,...defaults(n)}]); confSave(c); toast(`「${esc(n)}」を登録しました（位置のずれ ±${Math.round(f.acc)}m）。文と半径を確かめてください。`,6000); go('place',id); }); return; }
  if(act==='eSave'){ const c=C(); const p=(c.places||[]).find(x=>x.id===d.id); if(!p) return; p.name=$('eName').value.trim()||p.name; p.type=$('eType').value; p.r=Math.max(20,Math.min(500,+$('eR').value||60)); p.arrText=$('eArr').value.trim(); p.doneTexts=$('eDone').value.split('\n').map(s=>s.trim()).filter(Boolean); if($('eBefore')) p.beforeTexts=$('eBefore').value.split('\n').map(s=>s.trim()).filter(Boolean); confSave(c); toast('保存しました'); go('places'); return; }
  if(act==='eMove'){ getFix(f=>{ const c=C(); const p=(c.places||[]).find(x=>x.id===d.id); if(!p) return; p.lat=f.lat; p.lon=f.lon; confSave(c); toast(`中心を移しました（ずれ ±${Math.round(f.acc)}m）`); render(); }); return; }
  if(act==='eDel'){ if(!confirm('この場所を消しますか？')) return; const c=C(); c.places=(c.places||[]).filter(x=>x.id!==d.id); confSave(c); go('places'); return; }
  if(act==='toNippo'){ toNippo(); return; }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.tk){ const c=C(); c.tenko=el.value.replace(/^0/,''); confSave(c); const mid=+el.dataset.tk; const m=(T().msgs||[]).find(x=>x.id===mid); patch('msgs',mid,{texts:[garageText(m&&m.day||((m&&m.texts[0].match(/車庫着(.+?)、/))||[])[1]||'明日',c.tenko)]}); render(); }
});

// 場所の登録：GPS の位置を1回取る（ずれが50mより大きければ、もう少し待つ）
function getFix(cb){
  const m=$('pMsg'); if(m) m.textContent='位置を取っています…（空が見える所で、最長1分）';
  A.fixStart(); const t0=Date.now(); let best=null;
  const iv=setInterval(()=>{ const s=A.fixGet(); if(s){ const f=JSON.parse(s); if(!best||f.acc<best.acc) best=f; }
    if(best&&(best.acc>=0&&best.acc<=30||Date.now()-t0>20000)){ clearInterval(iv); if(best.acc>80){ if(m) m.textContent=`位置のずれが大きい（±${Math.round(best.acc)}m）ので登録しませんでした。外に出て、もう一度押してください。`; return; } cb(best); return; }
    if(Date.now()-t0>60000){ clearInterval(iv); if(m) m.textContent='位置が取れませんでした。位置の許可と、位置情報（GPS）がオンかを確かめてください。'; } },1000);
}

function stopAct(id,how){
  const s=(T().stops||[]).find(x=>x.id===id); if(!s) return;
  if(how==='place'){ const n=prompt('この場所の名前'); if(!n) return; const pid='p'+Date.now(); const c=C(); const df=defaults(n); c.places=(c.places||[]).concat([{id:pid,name:n,lat:s.lat,lon:s.lon,...df}]); A.confSave(JSON.stringify(c));
    add('visits',{pid,name:n,type:df.type,arr:s.start,dep:s.end,cargo:[],meter:'',fromStop:id}); patch('stops',id,{status:'place'}); toast(`「${esc(n)}」を登録して、行にしました`); render(); return; }
  patch('stops',id,{status:how}); render();
}

if(HAS){ load(true); setInterval(()=>load(false),2000); }
render();
</script>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e5a6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>運行日報</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@700&display=swap">
<style>
/* 紙の運行記録の行番号どおりに縦に並べ、行と行のあいだに「実車／空車」の切り替え。上に答え2つだけ */
:root{
  --paper:#eef1ef; --sheet:#ffffff; --ink:#1b2321; --muted:#5a6864; --rule:#c6d0cc;
  --accent:#0e5a6b; --accent-ink:#ffffff; --accent-soft:#deedf0; --warn:#9c4d0a; --warn-soft:#fbeee2;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:"BIZ UDGothic","BIZ UDPGothic",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111615; --sheet:#1a2120; --ink:#e5ebe9; --muted:#9aa7a3; --rule:#34403d;
  --accent:#6cc2d4; --accent-ink:#0b1d22; --accent-soft:#1c3338; --warn:#e8a46a; --warn-soft:#3a2816; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111615; --sheet:#1a2120; --ink:#e5ebe9; --muted:#9aa7a3; --rule:#34403d;
  --accent:#6cc2d4; --accent-ink:#0b1d22; --accent-soft:#1c3338; --warn:#e8a46a; --warn-soft:#3a2816; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.pad{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule)}
header .pad{padding-block:10px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans div{background:var(--accent-soft);border-radius:8px;padding:6px 10px}
.ans small{font-size:12px;color:var(--muted);letter-spacing:.1em}
.ans b{display:block;font-family:var(--f-num);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.ans .bad b{color:var(--warn)}
.ans em{display:block;font-style:normal;font-size:12px;color:var(--warn);min-height:0}
.ans em:empty{display:none}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
main .pad{padding-block:12px 80px}
h2{font-size:14px;color:var(--accent);letter-spacing:.15em;margin:18px 0 8px}
.head,.row,.seg{display:grid;grid-template-columns:1.15fr 1.7em 1.35fr 1.6em;gap:6px;align-items:center}
.tm{display:grid;grid-template-columns:1.3em 1fr;gap:4px 4px;align-items:center}
.tm i{font-style:normal;font-size:13px;color:var(--muted);text-align:center}
.row{border-top:1px solid var(--rule);padding-top:6px}
.mt{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.mt label{font-size:14px;color:var(--muted)}
.mt small{font-size:13px;color:var(--muted)}
.mt b{font-family:var(--f-num);font-size:22px;font-variant-numeric:tabular-nums;text-align:center}
.head{font-size:12px;color:var(--muted);padding:0 0 2px;text-align:center}
.no{font-family:var(--f-num);color:var(--accent);text-align:center}
input{font:inherit;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:17px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:9px 6px;width:100%;min-width:0;text-align:center}
input::placeholder{color:var(--muted);opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.ng{border-color:var(--warn);background:var(--warn-soft)}
input.auto{border-color:#3d74b8;background:#e4eefb}
input.maybe{border-color:#c79a1d;background:#fdf3d6}
input.est{border:2px dashed #7b5cc4;background:#f1ecfb}
.pl{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center}
.pl span{font-size:12px;color:var(--muted)}
.pl input{text-align:left;font-family:var(--f-body);font-size:15px;padding:7px 8px}
.sug{grid-column:1/-1}
.sug:empty{display:none}
.estb{font:inherit;font-size:13px;border:1px dashed #7b5cc4;background:transparent;color:#5b3fa8;border-radius:8px;padding:6px 10px;text-align:left;width:100%}
.sug p{margin:0;font-size:12px;color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) input.est{background:#2a2140;border-color:#a98ce6} :root:not([data-theme="light"]) .estb{color:#c4adf5;border-color:#a98ce6} :root:not([data-theme="light"]) input.auto{background:#1b2c44;border-color:#6d9bd6} :root:not([data-theme="light"]) input.maybe{background:#3a3014;border-color:#d9b44a}}
:root[data-theme="dark"] input.auto{background:#1b2c44;border-color:#6d9bd6}
:root[data-theme="dark"] input.maybe{background:#3a3014;border-color:#d9b44a}
:root[data-theme="dark"] input.est{background:#2a2140;border-color:#a98ce6}
:root[data-theme="dark"] .estb{color:#c4adf5;border-color:#a98ce6}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin:6px 0 0}
.chk input{width:auto;margin-top:3px}
.x{border:0;background:transparent;color:var(--muted);font:inherit;font-size:18px;padding:0}
.seg{margin:6px 0;font-size:13px;color:var(--muted)}
.seg>div{grid-column:1/4;display:flex;align-items:center;gap:8px}
.tg{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--sheet);color:var(--muted);border-radius:99px;padding:3px 12px;min-width:5.5em}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.seg span{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.rest{display:grid;grid-template-columns:1fr auto 1fr 2em;gap:6px;align-items:center;margin-bottom:6px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font:inherit;font-size:15px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:9px 14px}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.warn{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:8px 10px;margin:10px 0 0}
.warn:empty{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal>div{background:var(--sheet);border-radius:10px;padding:16px;max-width:340px;width:100%}
.crop{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:6px;margin:10px 0 4px;background:#fff}
.photo{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin-top:10px}
.photo p{margin:0}
.busy{font-size:13px;color:var(--accent);margin:8px 0 0}
.busy:empty{display:none}
</style>

</head>
<body>
<header><div class="pad">
  <div class="ans">
    <div id="aJ"><small>実車</small><b>—</b><em id="aJn"></em></div>
    <div id="aD"><small>運転時間</small><b>—</b><em id="aDn"></em></div>
  </div>
  <div class="sub" id="aSub"></div>
</div></header>

<main><div class="pad">
  <p class="note" style="margin-top:0">日報と同じ並びで打ち込みます（メーターは左の欄外、時刻は上が着・下が発）。時刻は「845」のように数字だけ、行のメーターは下3桁だけで足ります。荷を積んで走った区間は「実車」に切り替えてください。</p>
  <h2>メーター</h2>
  <div class="mt">
    <label for="mS">始業時メーター</label><input id="mS" data-k="1" data-f="start" inputmode="numeric" enterkeyhint="next" autocomplete="off" aria-label="始業時メーター"><small>km</small>
    <label for="mE">終業時メーター</label><input id="mE" data-k="1" data-f="end" inputmode="numeric" enterkeyhint="next" autocomplete="off" aria-label="終業時メーター"><small>km</small>
    <label>走行粁</label><b id="soukou">—</b><small>km</small>
  </div>
  <h2>運行記録</h2>
  <div class="btns" style="margin:0 0 6px"><button class="btn solid" id="camBtn">カメラで撮って行を作る</button><button class="btn" id="photoBtn">保存した写真から選ぶ</button><input type="file" id="camIn" accept="image/*" capture="environment" hidden><input type="file" id="photoIn" accept="image/*" hidden></div>
  <label class="chk"><input type="checkbox" id="ocrOn"><span>写真の数字も自動で読む（スマホの中で読みます。最初の1回だけ約45MBダウンロードします）</span></label>
  <p class="busy" id="busy"></p>
  <div id="photoTop"></div>
  <div class="head"><span>メーター（欄外）</span><span></span><span>上が着・下が発</span><span></span></div>
  <div id="rows"></div>
  <div class="btns"><button class="btn solid" id="add">＋ 行を足す</button></div>

  <h2>待機</h2>
  <p class="note" style="margin:0 0 8px">荷主に入れる時刻まで途中で止まって待っていた時間です。運転時間から引きます。</p>
  <div id="waits"></div>
  <div class="btns"><button class="btn" id="addW">＋ 待機を足す</button></div>

  <div class="warn" id="warn"></div>
  <div class="btns" style="margin-top:28px"><button class="btn" id="clear">全部消して新しい日にする</button></div>
  <p class="note">入力はこのスマホの中に残ります。</p>
</div></main>
<div class="modal" id="modal" hidden></div>
<datalist id="placeList"></datalist>

<script>
/* ===== 計算 CALC-BEGIN ===== */
// 845 / 0845 / 8:45 / 8.45 / 17 → "08:45"。読めなければ null
function normTime(v){
  const t=String(v??'').trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[：.．時]/g,':').replace(/分/g,'');
  if(!t) return '';
  let h,m; const r=t.match(/^(\d{1,2}):(\d{1,2})$/);
  if(r){h=+r[1];m=+r[2];} else if(/^\d{1,4}$/.test(t)){ if(t.length<=2){h=+t;m=0;} else {h=+t.slice(0,-2);m=+t.slice(-2);} } else return null;
  if(h>23||m>59) return null;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function hm(v){ const n=normTime(v); if(!n) return null; const [h,m]=n.split(':').map(Number); return h*60+m; }
function digits(v){ return String(v??'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\D/g,''); }
// 下の桁だけのメーターは、ひとつ前の値の上の桁で補う（桁が繰り上がったら次の桁へ）
function resolveMeter(input,prev){
  const d=digits(input); if(!d) return null;
  if(prev==null) return Number(d);
  if(d.length>4) return Number(d); // 5桁以上は全桁を打ったものとしてそのまま
  const u=10**d.length; let c=prev-(prev%u)+Number(d); if(c<prev) c+=u; return c;
}
function compute(rows,rests,waits=[],mt={}){
  const warn=[];
  const sV=digits(mt.start)?Number(digits(mt.start)):null, eV=digits(mt.end)?Number(digits(mt.end)):null;
  rows=rows.slice(); while(rows.length&&!digits(rows[rows.length-1].arr)&&!digits(rows[rows.length-1].dep)&&!digits(rows[rows.length-1].meter)) rows.pop();
  // 時刻を一本の時間軸に（0時をまたいだら翌日へ）
  let cur=null, off=0;
  const place=v=>{ const t=hm(v); if(t==null) return null; if(cur==null){cur=t;return t;} let a=t+off; while(a<cur){off+=1440;a=t+off;} cur=a; return a; };
  const T=rows.map(r=>({a:place(r.arr),d:place(r.dep)}));
  // 最初の行は空欄なら始業メーター、最後の行は空欄なら終業メーター。行の下3桁は始業メーターの上の桁で補う
  let prev=sV; const M=rows.map((r,i)=>{ let m=resolveMeter(r.meter,prev); if(m==null&&i===0&&sV!=null) m=sV; if(m==null&&i===rows.length-1&&i>0&&eV!=null) m=resolveMeter(String(eV),prev)??eV; if(m!=null){ if(prev!=null&&m<prev) warn.push(`${i+2}行目のメーターが前の行より小さい`); prev=m; } return m; });
  rows.forEach((r,i)=>{ if(r.arr&&hm(r.arr)==null) warn.push(`${i+2}行目の着「${r.arr}」が読めない`); if(r.dep&&hm(r.dep)==null) warn.push(`${i+2}行目の発「${r.dep}」が読めない`); });
  const segs=[];
  for(let i=0;i<rows.length-1;i++){
    const s=T[i].d, e=T[i+1].a;
    segs.push({s,e,min:(s!=null&&e!=null)?e-s:null,km:(M[i]!=null&&M[i+1]!=null)?M[i+1]-M[i]:null,loaded:!!rows[i].loaded});
  }
  // 休憩は走行区間と重なった分だけ運転時間から引く（運行の始まりより前の時刻なら翌日扱い）
  const t0=T.map(x=>x.d??x.a).find(x=>x!=null);
  const span=(list,label)=>{ const out=[]; let tot=0; list.forEach((r,j)=>{
    const f=hm(r.from), t=hm(r.to);
    if((r.from&&f==null)||(r.to&&t==null)) warn.push(`${label}${j+1}の時刻が読めない`);
    if(f==null||t==null) return;
    let a=f; if(t0!=null&&a<t0) a+=1440; let b=t+(a-f); if(b<a) b+=1440;
    tot+=b-a; out.push([a,b]); }); return [out,tot]; };
  const [RR,restTotal]=span(rests,'休憩'), [WW,waitTotal]=span(waits,'待機');
  const R=RR.concat(WW);
  let drive=null, gross=null, restIn=0;
  const missT=segs.filter(x=>x.min==null).length;
  const ok=segs.filter(x=>x.min!=null);
  if(ok.length){ gross=ok.reduce((p,x)=>p+x.min,0); ok.forEach(x=>R.forEach(([a,b])=>{restIn+=Math.max(0,Math.min(b,x.e)-Math.max(a,x.s));})); drive=gross-restIn; }
  if(R.length>1){ const q=R.slice().sort((x,y)=>x[0]-y[0]); for(let i=1;i<q.length;i++) if(q[i][0]<q[i-1][1]) warn.push('待機の時間どうしが重なっている（重なった分を二重に引いてしまう）'); }
  if(missT) warn.push(`時刻が足りない区間が${missT}つある（その区間は運転時間に入っていない）`);
  let jissha=0, missK=0; segs.forEach(x=>{ if(x.loaded){ if(x.km==null) missK++; else jissha+=x.km; } });
  if(missK) warn.push(`実車の区間のうち${missK}つでメーターが足りない（実車距離に入っていない）`);
  const known=M.filter(m=>m!=null);
  let soukou=known.length>=2?known[known.length-1]-known[0]:null;
  if(sV!=null&&eV!=null){ soukou=eV-sV; if(soukou<0) warn.push('終業時メーターが始業時メーターより小さい');
    const last=M[M.length-1]; if(last!=null&&last!==eV) warn.push(`最後の行のメーター（${last}）と終業時メーター（${eV}）が合わない`);
    if(M[0]!=null&&M[0]!==sV) warn.push(`最初の行のメーター（${M[0]}）と始業時メーター（${sV}）が合わない`); }
  return {segs,M,missT,jissha,missK,drive,gross,restIn,restTotal,waitTotal,soukou,anyLoaded:segs.some(x=>x.loaded),warn};
}
/* CALC-END */

const KEY='unkou-jissha-v2';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newRow=()=>({arr:'',dep:'',meter:'',loaded:false});
const PKEY='unkou-photo-v1';
let PH=null; try{ PH=JSON.parse(localStorage.getItem(PKEY)||'null'); }catch(e){}
const savePH=()=>{ try{ if(PH) localStorage.setItem(PKEY,JSON.stringify(PH)); else localStorage.removeItem(PKEY); }catch(e){} };
const LKEY='unkou-learn-v1';
function learnLoad(){ try{ return JSON.parse(localStorage.getItem(LKEY)||'[]'); }catch(e){ return []; } }
// 写真の欄の切り抜きと、いま入っている数字を記録する（新しい写真・写真を消す・全部消す の直前に呼ぶ）
function learnRows(){ // いまの写真の欄の切り抜きと、入っている数字
  const out=[]; if(!PH||!PH.cells) return out;
  D.rows.forEach((r,i)=>{ const c=PH.cells[i]; if(!c) return; ['arr','dep','meter'].forEach(f=>{ const img=c[f]; const v=digits(r[f]); if(!img||!v||(r.est&&r.est[f])) return;
    out.push({t:PH.t||Date.now(),f,v,auto:(r.autoV&&r.autoV[f])||'',img}); }); });
  return out;
}
// 新しい写真・写真を消す・全部消す の直前に、今日の分を記録に足す
function learnFlush(){
  const add=learnRows(); if(!add.length) return 0; const L=learnLoad().concat(add);
  while(L.length>1500) L.shift();
  for(;;){ try{ localStorage.setItem(LKEY,JSON.stringify(L)); break; }catch(e){ if(L.length<10) break; L.splice(0,Math.ceil(L.length/5)); } }
  if(PH) PH.cells=null; return add.length;
}
function learnExport(){
  const L=learnLoad().concat(learnRows()); if(!L.length) return 0;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(L)],{type:'application/json'}));
  a.download='nippo-yomitori-kiroku-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); return L.length;
}
const RKEY='unkou-routes-v1';
let ROUTES={places:{},seg:{}}; try{ const x=JSON.parse(localStorage.getItem(RKEY)||'null'); if(x&&x.places&&x.seg) ROUTES=x; }catch(e){}
const saveRoutes=()=>{ try{ localStorage.setItem(RKEY,JSON.stringify(ROUTES)); }catch(e){} };
const pname=v=>String(v||'').trim().replace(/\s+/g,' ');
// 今日の行から「場所→場所」の距離を覚える（推定した値は使わない）
function routeRecord(M){
  let ch=false;
  const unconfirmed=r=>r.placeRaw&&r.auto&&r.auto.place;
  D.rows.forEach((r,i)=>{ const a=pname(r.place); if(a&&!unconfirmed(r)&&ROUTES.places[a]==null){ ROUTES.places[a]=Date.now(); ch=true; } });
  for(let i=0;i<D.rows.length-1;i++){ const a=pname(D.rows[i].place), b=pname(D.rows[i+1].place); if(!a||!b||unconfirmed(D.rows[i])||unconfirmed(D.rows[i+1])) continue;
    const key=a+'→'+b, est=(D.rows[i].est&&D.rows[i].est.meter)||(D.rows[i+1].est&&D.rows[i+1].est.meter);
    const km=(M[i]!=null&&M[i+1]!=null)?M[i+1]-M[i]:null; const seg=ROUTES.seg[key]||(ROUTES.seg[key]={});
    const id=D.day+'#'+i;  // 同じ日に同じ区間を何回走っても、1回ずつ覚える
    if(!est&&km!=null&&km>0&&km<300){ if(seg[id]!==km){ seg[id]=km; ROUTES.places[a]=ROUTES.places[b]=Date.now(); ch=true; } }
    else if(seg[id]!=null){ delete seg[id]; ch=true; } }
  // 行を消したり場所を変えたりして、今日の記録が残りっぱなしにならないようにする
  const live=new Set(); for(let i=0;i<D.rows.length-1;i++){ const a=pname(D.rows[i].place), b=pname(D.rows[i+1].place); if(a&&b) live.add(a+'→'+b+'|'+D.day+'#'+i); }
  for(const [key,seg] of Object.entries(ROUTES.seg)) for(const id of Object.keys(seg)) if(id.startsWith(D.day+'#')&&!live.has(key+'|'+id)){ delete seg[id]; ch=true; }
  if(ch) saveRoutes();
}
function routeDist(a,b){ const seg=ROUTES.seg[pname(a)+'→'+pname(b)]; if(!seg) return null; const v=Object.values(seg).sort((x,y)=>x-y); if(!v.length) return null; return {km:v[v.length>>1],n:v.length}; }
const fresh=()=>({day:Date.now(),start:'',end:'',rows:[newRow(),newRow(),newRow()],rests:[{from:'',to:''}],waits:[{from:'',to:''}]});
let D=null; try{ D=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
if(!D||!Array.isArray(D.rows)) D=fresh();
if(!Array.isArray(D.waits)) D.waits=[{from:'',to:''}];
if(D.start==null) D.start=''; if(D.end==null) D.end=''; if(!D.day) D.day=Date.now();
const save=()=>{ try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){} };
const fmt=m=>m==null?'—':Math.floor(m/60)+'時間'+(m%60)+'分';

function render(){
  let h='';
  D.rows.forEach((r,i)=>{
    if(PH&&PH.rows&&PH.rows[i]) h+=`<img class="crop" src="${PH.rows[i]}" alt="写真の${i+2}行目">`;
    h+=`<div class="row">
      <input id="r${i}m" data-r="${i}" data-f="meter" class="${r.est&&r.est.meter?'est':(r.auto&&r.auto.meter?(r.auto.meter===2?'maybe':'auto'):'')}" inputmode="numeric" enterkeyhint="next" autocomplete="off" placeholder="" value="${esc(r.meter)}" aria-label="${i+2}行目 メーター">
      <span class="no">${i+2}</span>
      <div class="tm"><i>着</i><input id="r${i}a" data-r="${i}" data-f="arr" class="${r.auto&&r.auto.arr?(r.auto.arr===2?'maybe':'auto'):''}" inputmode="numeric" enterkeyhint="next" autocomplete="off" placeholder="${i===0?'—':''}" value="${esc(r.arr)}" aria-label="${i+2}行目 着">
        <i>発</i><input id="r${i}d" data-r="${i}" data-f="dep" class="${r.auto&&r.auto.dep?(r.auto.dep===2?'maybe':'auto'):''}" inputmode="numeric" enterkeyhint="next" autocomplete="off" placeholder="" value="${esc(r.dep)}" aria-label="${i+2}行目 発"></div>
      <button class="x" data-del="${i}" aria-label="${i+2}行目を消す">×</button>
      <div class="pl"><span>場所</span><input id="r${i}p" data-r="${i}" data-f="place" class="${r.auto&&r.auto.place?(r.auto.place===2?'maybe':'auto'):''}" list="placeList" autocomplete="off" enterkeyhint="next" placeholder="例：KFK甲府南（前に入れた場所は候補に出ます）" value="${esc(r.place||'')}" aria-label="${i+2}行目 場所"></div>
      <div class="sug" id="g${i}"></div></div>`;
    if(i<D.rows.length-1) h+=`<div class="seg"><div><button class="tg" data-ld="${i}" aria-pressed="${!!r.loaded}">${r.loaded?'実車':'空車'}</button><span id="s${i}"></span></div></div>`;
  });
  $('rows').innerHTML=h;
  $('placeList').innerHTML=Object.keys(ROUTES.places).sort((a,b)=>ROUTES.places[b]-ROUTES.places[a]).map(p=>`<option value="${esc(p)}">`).join('');
  $('mS').value=D.start; $('mE').value=D.end;
  const ah=D.autoHead||{}; [['mS','start'],['mE','end']].forEach(([id,f])=>{ $(id).classList.toggle('auto',ah[f]===1); $(id).classList.toggle('maybe',ah[f]===2); });
  $('photoTop').innerHTML=PH?`<div class="photo"><p class="note" style="margin:0 0 6px">写真から数字を自動で読みます。<b>青い欄</b>は読みが揃った数字、<b>黄色い欄</b>は自信のない数字です。どちらも写真と見比べて、違っていたら打ち直してください。空欄は読めなかった欄なので、写真を見て打ってください。始業・終業メーターも写真から読んで、空欄なら上の「メーター」欄に入れます（走行粁と合えば青）。店名も読んで、前に入れた場所の中から一番近いものを入れます（初めての店名は読んだ文字のまま黄色）。最初と最後の行のメーターは空欄のままで、始業・終業の値が使われます。実車／空車は「積荷個数」に書いてある行から決めています。線で消した字も「書いてある」と見てしまうので、確かめてください。</p>${PH.header?`<img class="crop" src="${PH.header}" alt="写真の始業・終業メーター">`:''}<div class="btns"><button class="btn" id="photoDel">写真を消す</button><button class="btn" id="learnExp">読み取りの記録を書き出す</button></div><p class="note">打ち込んだ正しい数字と、その欄の小さな切り抜きを、このスマホの中に記録しています（外へは送りません）。あとで読み取りを鍛えるのに使います。</p></div>`:'';
  $('waits').innerHTML=D.waits.map((r,j)=>`<div class="rest">
    <input id="w${j}f" data-w="${j}" data-f="from" inputmode="numeric" enterkeyhint="next" autocomplete="off" placeholder="" value="${esc(r.from)}" aria-label="待機${j+1} から">
    <span>〜</span>
    <input id="w${j}t" data-w="${j}" data-f="to" inputmode="numeric" enterkeyhint="next" autocomplete="off" placeholder="" value="${esc(r.to)}" aria-label="待機${j+1} まで">
    <button class="x" data-wdel="${j}" aria-label="待機${j+1}を消す">×</button></div>`).join('');
  update();
}
const listOf=t=>t.dataset.k!=null?D:t.dataset.r!=null?D.rows[+t.dataset.r]:t.dataset.q!=null?D.rests[+t.dataset.q]:D.waits[+t.dataset.w];
function update(){
  const c=compute(D.rows,[],D.waits,{start:D.start,end:D.end});
  $('soukou').textContent=c.soukou!=null?c.soukou:'—';
  const tail=v=>{ const d=digits(v); return d?d.slice(-3):''; };
  D.rows.forEach((r,i)=>{ const el=$('r'+i+'m'); if(el) el.placeholder=i===0&&D.start?tail(D.start):(i===D.rows.length-1&&i>0&&D.end?tail(D.end):''); });
  c.segs.forEach((g,i)=>{ const el=$('s'+i); if(el) el.textContent=(g.min==null?'— 分':g.min+'分')+' · '+(g.km==null?'— km':g.km+'km'); });
  $('aJ').querySelector('b').textContent=c.anyLoaded?c.jissha+' km':'—';
  $('aJ').classList.toggle('bad',c.missK>0);
  $('aD').querySelector('b').textContent=fmt(c.drive);
  $('aD').classList.toggle('bad',c.missT>0);
  $('aDn').textContent=c.missT?`時刻の足りない区間 ${c.missT}つ`:(c.drive!=null?'':'着・発を2行以上入れると出ます');
  $('aJn').textContent=c.missK?`メーターの足りない実車区間 ${c.missK}つ`:'';
  $('aSub').textContent=[c.soukou!=null?`走行 ${c.soukou}km`:'',c.drive!=null?`走った時間 ${fmt(c.gross)} − 待機 ${c.restIn}分`:'',(c.drive==null&&c.waitTotal)?`待機 ${c.waitTotal}分`:''].filter(Boolean).join('　');
  routeRecord(c.M);
  // メーターの書き忘れの補助：空欄の行に推定の候補を出す
  const M=c.M, n=D.rows.length, ests=[];
  D.rows.forEach((r,i)=>{ const g=$('g'+i); if(!g) return; g.innerHTML='';
    if(r.est&&r.est.meter) ests.push(i+2);
    if(digits(r.meter)||M[i]!=null) return;
    let j=i-1; while(j>=0&&M[j]==null) j--; let k=i+1; while(k<n&&M[k]==null) k++; if(k>=n) k=-1;
    const okv=v=>(j<0||v>M[j])&&(k<0||v<M[k]);
    let v=null, why='';
    if(j===i-1&&j>=0){ const d=routeDist(D.rows[j].place,r.place); if(d&&okv(M[j]+d.km)){ v=M[j]+d.km; why=`${pname(D.rows[j].place)}→${pname(r.place)} は前に ${d.km}km（${d.n}回分）`; } }
    if(v==null&&k===i+1){ const d=routeDist(r.place,D.rows[k].place); if(d&&okv(M[k]-d.km)){ v=M[k]-d.km; why=`${pname(r.place)}→${pname(D.rows[k].place)} は前に ${d.km}km（${d.n}回分）`; } }
    if(v==null&&j===i-1&&k===i+1&&!!D.rows[j].loaded===!!r.loaded){ v=Math.round((M[j]+M[k])/2); why=`前後どちらも${r.loaded?'実車':'空車'}なので、どの値でも実車距離の合計は変わりません`; }
    if(v!=null) g.innerHTML=`<button class="estb" data-est="${i}" data-v="${v}">メーター推定 ${String(v).slice(-3)} を入れる<br><small>${esc(why)}</small></button>`;
    else if((j>=0||k>=0)&&((i>0&&D.rows[i-1].loaded)||(i<n-1&&r.loaded))) g.innerHTML='<p>メーターが空欄です。この行と前後の行に場所を入れると、前に走った同じ区間の距離から推定します。</p>'; });
  const cw=c.warn.slice(); if(ests.length) cw.push(`${ests.join('・')}行目のメーターは推定した値です。紙に書くときは推定と分かるようにするか、運行管理者に確かめてください。`);
  $('warn').innerHTML=cw.map(esc).join('<br>');
  document.querySelectorAll('input[data-f=arr],input[data-f=dep],input[data-f=from],input[data-f=to]').forEach(el=>el.classList.toggle('ng',!!el.value&&normTime(el.value)==null));
}
document.addEventListener('input',e=>{
  const t=e.target, f=t.dataset.f; if(!f) return;
  listOf(t)[f]=t.value;
  if(t.dataset.r!=null){ const r=D.rows[+t.dataset.r]; if(r.auto&&r.auto[f]){ delete r.auto[f]; t.classList.remove('auto','maybe'); } if(r.est&&r.est[f]){ delete r.est[f]; t.classList.remove('est'); } }
  if(t.dataset.k!=null&&D.autoHead&&D.autoHead[f]){ delete D.autoHead[f]; t.classList.remove('auto','maybe'); }
  save(); update();
});
document.addEventListener('change',e=>{
  const t=e.target, f=t.dataset.f; if(!f||f==='meter'||f==='place'||t.dataset.k!=null) return;
  const n=normTime(t.value); if(n){ t.value=n; listOf(t)[f]=n; save(); update(); }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.target.tagName!=='INPUT') return;
  e.preventDefault(); const all=[...document.querySelectorAll('main input')]; const nx=all[all.indexOf(e.target)+1];
  if(nx) nx.focus(); else e.target.blur();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if(d.est!=null){ const r=D.rows[+d.est]; r.meter=String(d.v).slice(-3); r.est={meter:1}; if(r.auto) delete r.auto.meter; save(); render(); return; }
  if(d.ld!=null){ const r=D.rows[+d.ld]; r.loaded=!r.loaded; save(); b.setAttribute('aria-pressed',r.loaded); b.textContent=r.loaded?'実車':'空車'; update(); }
  else if(d.del!=null){ if(D.rows.length<=2) return; D.rows.splice(+d.del,1); save(); render(); }
  else if(d.rdel!=null){ D.rests.splice(+d.rdel,1); save(); render(); }
  else if(b.id==='add'){ D.rows.push(newRow()); save(); render(); $('r'+(D.rows.length-1)+'m').focus(); }
  else if(d.wdel!=null){ D.waits.splice(+d.wdel,1); save(); render(); }
  else if(b.id==='addW'){ D.waits.push({from:'',to:''}); save(); render(); }
  else if(b.id==='photoBtn'){ $('photoIn').value=''; $('photoIn').click(); }
  else if(b.id==='camBtn'){ $('camIn').value=''; $('camIn').click(); }
  else if(b.id==='photoDel'){ learnFlush(); PH=null; savePH(); render(); }
  else if(b.id==='learnExp'){ const n=learnExport(); $('busy').textContent=n?`読み取りの記録 ${n}件をファイルに書き出しました。`:'まだ記録がありません。'; }
  else if(b.id==='clear'){
    const m=$('modal'); m.innerHTML=`<div><p style="margin:0 0 14px">入力を全部消して、新しい日にしますか？</p><div class="btns" style="justify-content:flex-end"><button class="btn" id="mNo">やめる</button><button class="btn solid" id="mOk">消す</button></div></div>`; m.hidden=false;
    $('mNo').onclick=()=>m.hidden=true; $('mOk').onclick=()=>{ m.hidden=true; learnFlush(); D=fresh(); PH=null; savePH(); save(); render(); scrollTo(0,0); };
  }
});
const onPhoto=async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  $('busy').textContent='写真を読み取っています…';
  await new Promise(r=>setTimeout(r,30));
  let res; try{ res=await window.NippoPhoto.analyze(f); }catch(err){ res={ok:false}; }
  $('busy').textContent='';
  if(!res.ok){ $('busy').textContent=res.empty?'書いてある行が見つかりませんでした。':'用紙を見つけられませんでした。上から、用紙全体が入るように撮り直してください。'; return; }
  const apply=()=>{
    learnFlush();   // 前の写真の分を、行を作り直す前に記録する
    D.day=Date.now();  // 写真ごとに新しい日として距離を覚える
    D.rows=res.rows.map(r=>({arr:'',dep:'',meter:'',loaded:r.loaded}));
    if(D.rows.length<2) D.rows.push(newRow());
    const small=cv=>{ if(!cv) return null; const h=48, w=Math.max(8,Math.round(cv.width*h/cv.height)), c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(cv,0,0,w,h); return c.toDataURL('image/jpeg',0.8); };
    PH={rows:res.rows.map(r=>r.img),header:res.header,t:Date.now(),
      cells:res.rows.map(r=>({arr:r.hasArr?small(r.ocr.arr.A):null,dep:r.hasDep?small(r.ocr.dep.A):null,meter:small(r.ocr.meter.C||r.ocr.meter.A)}))}; savePH(); save(); render();
    $('photoTop').scrollIntoView({behavior:'smooth',block:'start'});
    if($('ocrOn').checked) readDigits(res.rows,res.head);
  };
  const used=D.rows.some(r=>digits(r.arr)||digits(r.dep)||digits(r.meter));
  if(!used){ apply(); return; }
  const m=$('modal'); m.innerHTML=`<div><p style="margin:0 0 14px">いま入っている運行記録を消して、写真の${res.rows.length}行に作り直しますか？（待機はそのまま）</p><div class="btns" style="justify-content:flex-end"><button class="btn" id="mNo">やめる</button><button class="btn solid" id="mOk">作り直す</button></div></div>`; m.hidden=false;
  $('mNo').onclick=()=>m.hidden=true; $('mOk').onclick=()=>{ m.hidden=true; apply(); };
};
async function readDigits(prow,head){
  const rowsAt=D.rows; // 読んでいる間に作り直されたら反映しない
  try{
    const prog=p=>{ $('busy').textContent=p.phase==='download'?`数字を読む部品をダウンロード中… ${(p.bytes/1048576).toFixed(0)}MB（最初の1回だけ）`:'始業・終業メーターを読み取っています…'; };
    // 始業・終業メーター（空欄のときだけ入れる）
    let hn='';
    if(head&&(!digits(D.start)||!digits(D.end))){ const h=await window.NippoOCR.readHead(head,prog);
      if(D.rows!==rowsAt){ $('busy').textContent=''; return; }
      if(h&&h.start){ D.autoHead=D.autoHead||{}; if(!digits(D.start)){ D.start=h.start.v; D.autoHead.start=h.start.tier==='blue'?1:2; } if(!digits(D.end)){ D.end=h.end.v; D.autoHead.end=h.end.tier==='blue'?1:2; }
        hn=h.checked?'始業・終業メーターは走行粁と合いました（青）。':'始業・終業メーターは走行粁で確かめられなかったので黄色です。'; save(); render(); } }
    const {res}=await window.NippoOCR.readRows(prow,{start:D.start,end:D.end},p=>{
      $('busy').textContent=p.phase==='download'?`数字を読む部品をダウンロード中… ${(p.bytes/1048576).toFixed(0)}MB（最初の1回だけ）`:`数字を読み取っています… ${Math.round(p.done/p.total*100)}%`; });
    if(D.rows!==rowsAt){ $('busy').textContent=''; return; }
    let n=0,nm=0;
    res.forEach((r,i)=>{ const row=D.rows[i]; if(!row) return; row.auto=row.auto||{};
      ['arr','dep','meter'].forEach(f=>{ const x=r[f]; if(!x||digits(row[f])) return;
        if(f==='meter'&&i===0&&digits(D.start)) return;              // 最初の行は始業メーターを使う
        if(f==='meter'&&i===D.rows.length-1&&digits(D.end)) return;   // 最後の行は終業メーターを使う
        row[f]=x.v; row.auto[f]=x.tier==='blue'?1:2; row.autoV=row.autoV||{}; row.autoV[f]=digits(x.v); x.tier==='blue'?n++:nm++; }); });
    // 店名（空欄のときだけ）
    let pn=0,pm=0;
    try{
      const known=Object.keys(ROUTES.places);
      const pl=await window.NippoOCR.readPlaces(prow,known,()=>{ $('busy').textContent='店名を読み取っています…'; });
      if(D.rows===rowsAt) pl.forEach((x,i)=>{ const row=D.rows[i]; if(!x||!row||pname(row.place)) return; row.place=x.name; row.auto=row.auto||{}; row.auto.place=x.tier==='blue'?1:2; if(x.raw) row.placeRaw=1; x.tier==='blue'?pn++:pm++; });
    }catch(e){}
    save(); render();
    if(pn+pm) hn=(hn?hn+' ':'')+`店名：青 ${pn}か所・黄 ${pm}か所。`;
    $('busy').textContent=((n+nm)?`自動で入れました：青 ${n}か所・黄 ${nm}か所。写真と見比べてください。`:'自動で読める数字はありませんでした。写真を見て打ってください。')+(hn?' '+hn:'');
  }catch(err){ $('busy').textContent='数字の自動読み取りができませんでした（電波が無い・部品をダウンロードできない など）。写真を見て打ってください。'; }
}
try{ $('ocrOn').checked=localStorage.getItem('unkou-ocr-on')!=='0'; }catch(e){ $('ocrOn').checked=true; }
$('ocrOn').addEventListener('change',e=>{ try{ localStorage.setItem('unkou-ocr-on',e.target.checked?'1':'0'); }catch(err){} });
$('photoIn').addEventListener('change',onPhoto);
$('camIn').addEventListener('change',onPhoto);
render();
// 電波が無くても開けるように、ページを端末に保存しておく
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
<script src="photo.js"></script>
<script src="ocr.js"></script>
